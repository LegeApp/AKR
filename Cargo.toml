[workspace]
resolver = "3"
members = ["crates/akr-core", "crates/akr-cli", "crates/akr-mcp", "crates/akr-gui"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
